openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ludo Stake Game API. All wagering and balances are sandbox-only.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Local email and password accounts
  - name: wallet
    description: Sandbox wallet and test deposits
  - name: games
    description: Two-player Ludo lobby and matches
paths:
  /match/start:
    post:
      operationId: startUnityMatch
      tags: [unity]
      security: [{ UnityServerKey: [] }]
      description: Private trusted-server operation. Stake amounts are whole NGN and sandbox-only. Both players must have authorized the stakes with the trusted server.
      parameters:
        - { in: header, name: X-Unity-Server-Key, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnityMatchInput' }
      responses:
        '200':
          description: Atomically funded match or an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnityMatchStart' }
        '400': { description: Invalid payload or idempotency key }
        '401': { description: Invalid server credential }
        '409': { description: Insufficient funds or conflicting retry }
        '503': { description: Bridge not configured }
  /match/end:
    post:
      operationId: endUnityMatch
      tags: [unity]
      security: [{ UnityServerKey: [] }]
      description: Only the trusted authoritative server can report results. A tied report keeps escrow locked for Golden Goal; clients cannot authorize payouts.
      parameters:
        - { in: header, name: X-Unity-Server-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnityMatchResultInput' }
      responses:
        '200':
          description: Settled exactly once, an identical retry, or active Golden Goal overtime
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnityMatchSettlement' }
        '400': { description: 'Invalid scores, draw flag or winner' }
        '401': { description: Invalid or expired credentials }
        '404': { description: Match not found }
        '409': { description: Conflicting result or closed session }
        '503': { description: Bridge not configured }
  /match/status/{matchId}:
    get:
      operationId: getUnityMatchStatus
      tags: [unity]
      security: [{ UnityServerKey: [] }, { UnityMatchBearer: [] }]
      description: Authenticate with Authorization Bearer matchToken, or the private server credential. Never send tokens in query strings.
      parameters:
        - { in: path, name: matchId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current persisted match and escrow state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnityMatchStatus' }
        '401': { description: Authentication required }
        '404': { description: Match not found }
  /football/lobby:
    get:
      operationId: getFootballLobby
      tags: [football]
      responses:
        '200':
          description: Waiting football rooms and your current match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballLobby'
        '401':
          description: Sign in required
  /football/rooms:
    post:
      operationId: joinFootballRoom
      tags: [football]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootballJoinRequest'
      responses:
        '200':
          description: Football room created, resumed or joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '400':
          description: Invalid stake
        '401':
          description: Sign in required
        '409':
          description: Room unavailable or insufficient balance
  /football/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFootballRoom
      tags: [football]
      responses:
        '200':
          description: Authoritative football room snapshot for a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '401':
          description: Sign in required
        '404':
          description: Room not found or not a participant
    delete:
      operationId: cancelFootballRoom
      tags: [football]
      responses:
        '200':
          description: Waiting room cancelled; waiting rooms never debit stakes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '401':
          description: Sign in required
        '409':
          description: Only the host can cancel a waiting room
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "409":
          description: Email or username is already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Email or password is incorrect
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not signed in
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get sandbox balance, held stakes, and recent activity
      responses:
        "200":
          description: Wallet overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          description: Not signed in
  /deposits/initialize:
    post:
      operationId: initializeDeposit
      tags: [wallet]
      summary: Start a Paystack test-mode deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Hosted test checkout initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositInitialization"
        "400":
          description: Invalid deposit amount
        "401":
          description: Not signed in
        "503":
          description: Paystack test configuration is unavailable
  /deposits/verify:
    post:
      operationId: verifyDeposit
      tags: [wallet]
      summary: Verify a Paystack test deposit and credit it once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositVerificationInput"
      responses:
        "200":
          description: Deposit verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositVerification"
        "401":
          description: Not signed in
        "404":
          description: Deposit reference not found for this account
  /withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Reserve sandbox funds and use a Paystack test or local simulated transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Test withdrawal initiated or locally simulated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid amount or insufficient available balance
        "401":
          description: Not signed in
        "502":
          description: Paystack test transfer unavailable
        "503":
          description: Paystack test mode is not configured
  /withdrawals/{withdrawalId}/verify:
    post:
      operationId: verifyWithdrawal
      tags: [wallet]
      summary: Reconcile a test withdrawal without debiting twice
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current test withdrawal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "401":
          description: Not signed in
        "404":
          description: Withdrawal not found
  /lobby:
    get:
      operationId: getLobby
      tags: [games]
      summary: List available two-player matches and stake counts
      responses:
        "200":
          description: Lobby rooms and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyResponse"
        "401":
          description: Not signed in
  /rooms:
    post:
      operationId: joinRoom
      tags: [games]
      summary: Join an open match at a fixed stake or create a waiting room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomInput"
      responses:
        "201":
          description: Match found or waiting room created; stake is reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Unsupported stake or insufficient sandbox balance
        "401":
          description: Not signed in
  /rooms/practice-ai:
    post:
      operationId: playAiRoom
      tags: [games]
      summary: Start a free two-player Ludo practice match against the server AI
      responses:
        "201":
          description: Active no-stake practice match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Player already has an open match
        "401":
          description: Not signed in
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [games]
      summary: Get match details and current board state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/roll:
    post:
      operationId: rollDice
      tags: [games]
      summary: Roll the die for the current player's turn
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated match and board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Match is not active or the die was already rolled
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/move:
    post:
      operationId: moveToken
      tags: [games]
      summary: Move a Ludo token using the current die roll
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "200":
          description: Updated match and board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Illegal token move
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/cancel:
    post:
      operationId: cancelRoom
      tags: [games]
      summary: Cancel a waiting room, end free practice, or forfeit an active human match
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled room, forfeiture, or updated active match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Cancellation is not allowed for this room state or participant
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/ai:
    post:
      operationId: addAiOpponent
      tags: [games]
      summary: Fill a free one-player Practice Ground waiting room with Mosquito AI
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Practice match started with AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Only a free, single-player Practice Ground room can add AI
        "401":
          description: Not signed in
        "404":
          description: Waiting room not found
components:
  securitySchemes:
    UnityServerKey:
      type: apiKey
      in: header
      name: X-Unity-Server-Key
      description: Private server-only credential. Never embed in Unity clients.
    UnityMatchBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Match-scoped polling token. Does not authorize wallet mutations.
  schemas:
    UnityMatchInput:
      type: object
      additionalProperties: false
      required: [player1Id, player2Id, stakeAmount, gameType]
      properties:
        player1Id: { type: string, format: uuid }
        player2Id: { type: string, format: uuid }
        stakeAmount: { type: integer, minimum: 1, maximum: 1000000, description: 'Whole NGN per player, never kobo' }
        gameType: { type: string, enum: [football_11v11] }
    UnityMatchResultInput:
      type: object
      additionalProperties: false
      required: [matchId, matchToken, player1Score, player2Score, winnerId, isDraw]
      properties:
        matchId: { type: string, format: uuid }
        matchToken: { type: string, minLength: 1, maxLength: 2048 }
        player1Score: { type: integer, minimum: 0, maximum: 99 }
        player2Score: { type: integer, minimum: 0, maximum: 99 }
        winnerId: { type: [string, 'null'], format: uuid }
        isDraw: { type: boolean }
    UnityPlayer:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
    UnityMatchStart:
      type: object
      required: [success, matchId, matchToken, player1, player2, stakeAmount, status, tokenExpiresAt]
      properties:
        success: { type: boolean }
        matchId: { type: string, format: uuid }
        matchToken: { type: string }
        player1: { $ref: '#/components/schemas/UnityPlayer' }
        player2: { $ref: '#/components/schemas/UnityPlayer' }
        stakeAmount: { type: integer }
        status: { type: string, enum: [PENDING, ACTIVE, COMPLETED, CANCELLED] }
        tokenExpiresAt: { type: string, format: date-time }
    UnityMatchSettlement:
      type: object
      required: [success, message, winnerPayout, commissionLogged, status, overtime, settled]
      properties:
        success: { type: boolean }
        message: { type: string }
        winnerPayout: { type: number, description: NGN credited to winner }
        commissionLogged: { type: number, description: NGN credited to platform }
        status: { type: string, enum: [PENDING, ACTIVE, COMPLETED, CANCELLED] }
        overtime: { type: boolean }
        settled: { type: boolean }
    UnityMatchStatus:
      type: object
      required: [matchId, status, gameType, player1Id, player2Id, stakeAmount, totalPool, player1Score, player2Score, winnerId, overtime, drawRule, winnerPayout, commissionLogged, startedAt, completedAt, sandboxOnly]
      properties:
        matchId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE, COMPLETED, CANCELLED] }
        gameType: { type: string, enum: [football_11v11] }
        player1Id: { type: string, format: uuid }
        player2Id: { type: string, format: uuid }
        stakeAmount: { type: integer }
        totalPool: { type: integer }
        player1Score: { type: [integer, 'null'] }
        player2Score: { type: [integer, 'null'] }
        winnerId: { type: [string, 'null'], format: uuid }
        overtime: { type: boolean }
        drawRule: { type: string, enum: [golden_goal] }
        winnerPayout: { type: number }
        commissionLogged: { type: number }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        sandboxOnly: { type: boolean }
    FootballJoinRequest:
      type: object
      required: [stakeNaira]
      properties:
        stakeNaira: { type: integer, enum: [500, 1000, 2000] }
        roomId: { type: string, format: uuid }
        club: { $ref: '#/components/schemas/FootballClub' }
    FootballClub:
      type: string
      enum: [man_city, liverpool, man_utd, barcelona, real_madrid, chelsea]
    FootballPlayer:
      type: object
      required: [id, team, number, role, x, y, z, facing, animation, animationStartedAt, animationUntil]
      properties:
        id: { type: string }
        team: { type: string, enum: [home, away] }
        number: { type: integer }
        role: { type: string, enum: [GK, DEF, MID, FWD] }
        x: { type: number }
        y: { type: number }
        z: { type: number, description: Server-authoritative elevation in metres }
        facing: { type: number, description: Radians, zero faces positive pitch y }
        animation: { type: string, enum: [idle, run, kick, slide, dive] }
        animationStartedAt: { type: integer }
        animationUntil: { type: integer }
    FootballBall:
      type: object
      required: [x, y, z, vx, vy, vz, ownerId]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
        vx: { type: number }
        vy: { type: number }
        vz: { type: number }
        ownerId: { type: string, nullable: true }
    FootballState:
      type: object
      required: [players, ball, scoreHome, scoreAway, controlledHome, controlledAway, phase, homeDirection, startedAt, serverTimeAt, elapsedMs, remainingMs, lastTickAt, pauseUntil, ballFreeAt, lastTouchId, lastActionHomeAt, lastActionAwayAt, lastEvent, sequence, winnerTeam, homeClub, awayClub, timingVersion, halfDurationMs, addedTimeMs, halftimeBreakMs, phaseRemainingMs]
      properties:
        players:
          type: array
          items: { $ref: '#/components/schemas/FootballPlayer' }
        ball: { $ref: '#/components/schemas/FootballBall' }
        scoreHome: { type: integer }
        scoreAway: { type: integer }
        controlledHome: { type: string }
        controlledAway: { type: string }
        phase: { type: string, enum: [waiting, first_half, first_added, halftime, second_half, second_added, overtime, finished] }
        homeClub: { $ref: '#/components/schemas/FootballClub' }
        awayClub: { $ref: '#/components/schemas/FootballClub' }
        timingVersion: { type: integer, enum: [1, 2] }
        halfDurationMs: { type: integer }
        addedTimeMs: { type: integer }
        halftimeBreakMs: { type: integer }
        phaseRemainingMs: { type: integer }
        homeDirection: { type: number, enum: [-1, 1] }
        startedAt: { type: string, format: date-time, nullable: true }
        serverTimeAt: { type: string, format: date-time }
        elapsedMs: { type: integer }
        remainingMs: { type: integer }
        lastTickAt: { type: integer }
        pauseUntil: { type: integer }
        ballFreeAt: { type: integer }
        lastTouchId: { type: string, nullable: true }
        lastActionHomeAt: { type: integer }
        lastActionAwayAt: { type: integer }
        lastEvent: { type: string }
        sequence: { type: integer }
        winnerTeam: { type: string, enum: [home, away], nullable: true }
    FootballRoom:
      type: object
      required: [id, status, stakeNaira, potNaira, prizeNaira, commissionNaira, hostUserId, opponentUserId, winnerUserId, hostUsername, opponentUsername, viewerTeam, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [waiting, active, completed, cancelled] }
        stakeNaira: { type: integer }
        potNaira: { type: integer }
        prizeNaira: { type: integer }
        commissionNaira: { type: integer }
        hostUserId: { type: string, format: uuid }
        opponentUserId: { type: string, format: uuid, nullable: true }
        winnerUserId: { type: string, format: uuid, nullable: true }
        hostUsername: { type: string }
        opponentUsername: { type: string, nullable: true }
        viewerTeam: { type: string, enum: [home, away], nullable: true }
        createdAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/FootballState' }
    FootballLobby:
      type: object
      required: [rooms, myRoom]
      properties:
        rooms:
          type: array
          items: { $ref: '#/components/schemas/FootballRoom' }
        myRoom:
          allOf:
            - $ref: '#/components/schemas/FootballRoom'
          nullable: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      required: [id, username, email, balanceNaira]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        balanceNaira:
          type: integer
          minimum: 0
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 4
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
    WalletTransaction:
      type: object
      required: [id, type, amountNaira, description, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [deposit, stake_lock, stake_release, prize, withdrawal_lock, withdrawal_release]
        amountNaira:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    WalletResponse:
      type: object
      required: [balanceNaira, totalBalanceNaira, escrowedNaira, withdrawalHeldNaira, transactions, withdrawals]
      properties:
        balanceNaira:
          type: integer
        totalBalanceNaira:
          type: integer
        escrowedNaira:
          type: integer
        withdrawalHeldNaira:
          type: integer
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
    DepositInput:
      type: object
      required: [amountNaira]
      properties:
        amountNaira:
          type: integer
          minimum: 500
          maximum: 500000
    DepositInitialization:
      type: object
      required: [authorizationUrl, reference, amountNaira]
      properties:
        authorizationUrl:
          type: string
          format: uri
        reference:
          type: string
        amountNaira:
          type: integer
    DepositVerificationInput:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 120
    DepositVerification:
      type: object
      required: [status, amountNaira, balanceNaira]
      properties:
        status:
          type: string
          enum: [success, pending, failed]
        amountNaira:
          type: integer
        balanceNaira:
          type: integer
    WithdrawalInput:
      type: object
      required: [amountNaira, requestId, recipientName, accountNumber, bankCode]
      properties:
        amountNaira:
          type: integer
          minimum: 500
          maximum: 500000
        requestId:
          type: string
          format: uuid
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        accountNumber:
          type: string
          pattern: "^[0-9]{10}$"
        bankCode:
          type: string
          pattern: "^[0-9]{3,6}$"
    Withdrawal:
      type: object
      required: [id, reference, amountNaira, status, createdAt, simulated]
      properties:
        id:
          type: string
        reference:
          type: string
        amountNaira:
          type: integer
        status:
          type: string
          enum: [pending, success, failed]
        createdAt:
          type: string
          format: date-time
        simulated:
          type: boolean
          description: True when recipient resolution failed and the test payout was settled locally without a bank transfer.
    LobbyRoom:
      type: object
      required: [id, tierId, tierName, stakeNaira, potNaira, maxPotNaira, playerCount, maxPlayers, status, joinWindowOpen, isAiPractice, players, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tierId:
          type: string
          enum: [oga-chairman, big-doings, senior-man, sharp-guy, quick-clash, street-king, board-master, area-hustler, practice-ground]
        tierName:
          type: string
        stakeNaira:
          type: integer
          minimum: 0
        potNaira:
          type: integer
        maxPotNaira:
          type: integer
        playerCount:
          type: integer
          minimum: 1
          maximum: 4
        maxPlayers:
          type: integer
          enum: [2, 4]
        status:
          type: string
          enum: [waiting, active]
        joinWindowOpen:
          type: boolean
        isAiPractice:
          type: boolean
        players:
          type: array
          items:
            $ref: "#/components/schemas/RoomPlayer"
        createdAt:
          type: string
          format: date-time
    RoomTier:
      type: object
      required: [id, name, stakeNaira, minPlayers, maxPlayers, minPotNaira, maxPotNaira, openRoomCount]
      properties:
        id:
          type: string
          enum: [oga-chairman, big-doings, senior-man, sharp-guy, quick-clash, street-king, board-master, area-hustler, practice-ground]
        name:
          type: string
        stakeNaira:
          type: integer
          minimum: 0
        minPlayers:
          type: integer
          enum: [2]
        maxPlayers:
          type: integer
          enum: [2, 4]
        minPotNaira:
          type: integer
        maxPotNaira:
          type: integer
        openRoomCount:
          type: integer
    RoomPlayer:
      type: object
      required: [userId, username, color]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        color:
          type: string
          enum: [red, green, yellow, blue]
    LobbyResponse:
      type: object
      required: [rooms, tiers, myRoomId, myRoom]
      properties:
        myRoomId:
          type: ["string", "null"]
        myRoom:
          oneOf:
            - $ref: "#/components/schemas/LobbyRoom"
            - type: "null"
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/LobbyRoom"
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/RoomTier"
    JoinRoomInput:
      type: object
      required: [tierId]
      properties:
        roomId:
          type: string
          format: uuid
        tierId:
          type: string
          enum: [oga-chairman, big-doings, senior-man, sharp-guy, quick-clash, street-king, board-master, area-hustler, practice-ground]
    BoardState:
      type: object
      required: [turnUserId, playerOrder, joinWindowOpen, dice, remainingDice, consecutiveDoubles, turnMessage, hasRolled, redTokens, greenTokens, yellowTokens, blueTokens, winnerUserId, turnDeadlineAt, matchDeadlineAt, isOvertime, endReason]
      properties:
        matchDeadlineAt:
          type: ["string", "null"]
          format: date-time
        isOvertime:
          type: boolean
        endReason:
          type: ["string", "null"]
          enum: [all_home, timeout, overtime, forfeit, null]
        forfeitedUserIds:
          type: array
          items:
            type: string
            format: uuid
        turnUserId:
          type: string
        playerOrder:
          type: array
          items:
            type: string
            format: uuid
        joinWindowOpen:
          type: boolean
        turnDeadlineAt:
          type: ["string", "null"]
          format: date-time
        dice:
          type: ["array", "null"]
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 6
        remainingDice:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            enum: [0, 1]
        consecutiveDoubles:
          type: integer
          minimum: 0
          maximum: 3
          description: Number of consecutive double-six rolls in the current turn, capped at three.
        turnMessage:
          type: ["string", "null"]
          enum: [third_double, double_bonus, capture_bonus, six_bonus, capture_plus_ten, double_six_bonus, double_six_limit, capture_home, no_moves, timeout, null]
        captureBonusPending:
          type: boolean
          description: Legacy compatibility field; current capture rules never apply a movement bonus.
        lastMove:
          type: ["object", "null"]
          required: [kind, color, tokenIndex]
          properties:
            kind:
              type: string
              enum: [capture_home]
            color:
              type: string
              enum: [red, green, yellow, blue]
            tokenIndex:
              type: integer
              minimum: 0
              maximum: 3
        hasRolled:
          type: boolean
        redTokens:
          type: array
          items:
            type: integer
        greenTokens:
          type: array
          items:
            type: integer
        yellowTokens:
          type: array
          items:
            type: integer
        blueTokens:
          type: array
          items:
            type: integer
        winnerUserId:
          type: ["string", "null"]
    PlayerRank:
      type: object
      required: [tokensHome, totalProgress]
      properties:
        tokensHome:
          type: integer
          minimum: 0
          maximum: 4
        totalProgress:
          type: integer
          minimum: 0
          maximum: 232
    Room:
      type: object
      required:
        [id, tierId, tierName, stakeNaira, potNaira, prizeNaira, commissionNaira, maxPotNaira, maxPlayers, playerCount, players, status, hostUserId, hostUsername, opponentUserId, opponentUsername, myColor, board, createdAt, serverTimeAt, scores]
      properties:
        serverTimeAt:
          type: string
          format: date-time
        scores:
          type: object
          required: [red, green, yellow, blue]
          properties:
            red:
              $ref: "#/components/schemas/PlayerRank"
            green:
              $ref: "#/components/schemas/PlayerRank"
            yellow:
              $ref: "#/components/schemas/PlayerRank"
            blue:
              $ref: "#/components/schemas/PlayerRank"
        id:
          type: string
        tierId:
          type: ["string", "null"]
          enum: [oga-chairman, big-doings, senior-man, sharp-guy, quick-clash, street-king, board-master, area-hustler, practice-ground, null]
        tierName:
          type: string
        stakeNaira:
          type: integer
          minimum: 0
        potNaira:
          type: integer
        prizeNaira:
          type: integer
        commissionNaira:
          type: integer
        maxPotNaira:
          type: integer
        maxPlayers:
          type: integer
          enum: [2, 4]
        playerCount:
          type: integer
          minimum: 1
          maximum: 4
        players:
          type: array
          items:
            $ref: "#/components/schemas/RoomPlayer"
        status:
          type: string
          enum: [waiting, active, completed, cancelled]
        hostUserId:
          type: string
        hostUsername:
          type: string
        opponentUserId:
          type: ["string", "null"]
        opponentUsername:
          type: ["string", "null"]
        myColor:
          type: string
          enum: [red, green, yellow, blue]
        board:
          $ref: "#/components/schemas/BoardState"
        createdAt:
          type: string
          format: date-time
    MoveInput:
      type: object
      required: [tokenIndex, diceIndices]
      properties:
        tokenIndex:
          type: integer
          minimum: 0
          maximum: 3
        diceIndices:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            enum: [0, 1]

