openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ludo Stake Game API. All wagering and balances are sandbox-only.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Local email and password accounts
  - name: wallet
    description: Sandbox wallet and test deposits
  - name: games
    description: Two-player Ludo lobby and matches
paths:
  /football/lobby:
    get:
      operationId: getFootballLobby
      tags: [football]
      responses:
        '200':
          description: Waiting football rooms and your current match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballLobby'
        '401':
          description: Sign in required
  /football/rooms:
    post:
      operationId: joinFootballRoom
      tags: [football]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootballJoinRequest'
      responses:
        '200':
          description: Football room created, resumed or joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '400':
          description: Invalid stake
        '401':
          description: Sign in required
        '409':
          description: Room unavailable or insufficient balance
  /football/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFootballRoom
      tags: [football]
      responses:
        '200':
          description: Authoritative football room snapshot for a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '401':
          description: Sign in required
        '404':
          description: Room not found or not a participant
    delete:
      operationId: cancelFootballRoom
      tags: [football]
      responses:
        '200':
          description: Waiting room cancelled; waiting rooms never debit stakes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballRoom'
        '401':
          description: Sign in required
        '409':
          description: Only the host can cancel a waiting room
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
        "409":
          description: Email or username is already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Email or password is incorrect
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not signed in
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get sandbox balance, held stakes, and recent activity
      responses:
        "200":
          description: Wallet overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          description: Not signed in
  /deposits/initialize:
    post:
      operationId: initializeDeposit
      tags: [wallet]
      summary: Start a Paystack test-mode deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Hosted test checkout initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositInitialization"
        "400":
          description: Invalid deposit amount
        "401":
          description: Not signed in
        "503":
          description: Paystack test configuration is unavailable
  /deposits/verify:
    post:
      operationId: verifyDeposit
      tags: [wallet]
      summary: Verify a Paystack test deposit and credit it once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositVerificationInput"
      responses:
        "200":
          description: Deposit verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositVerification"
        "401":
          description: Not signed in
        "404":
          description: Deposit reference not found for this account
  /withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Reserve sandbox funds and initiate a Paystack test bank transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Test withdrawal initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid test destination or insufficient available balance
        "401":
          description: Not signed in
        "502":
          description: Paystack test transfer unavailable
  /withdrawals/{withdrawalId}/verify:
    post:
      operationId: verifyWithdrawal
      tags: [wallet]
      summary: Reconcile a test withdrawal without debiting twice
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current test withdrawal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "401":
          description: Not signed in
        "404":
          description: Withdrawal not found
  /lobby:
    get:
      operationId: getLobby
      tags: [games]
      summary: List available two-player matches and stake counts
      responses:
        "200":
          description: Lobby rooms and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyResponse"
        "401":
          description: Not signed in
  /rooms:
    post:
      operationId: joinRoom
      tags: [games]
      summary: Join an open match at a fixed stake or create a waiting room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomInput"
      responses:
        "201":
          description: Match found or waiting room created; stake is reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Unsupported stake or insufficient sandbox balance
        "401":
          description: Not signed in
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [games]
      summary: Get match details and current board state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/roll:
    post:
      operationId: rollDice
      tags: [games]
      summary: Roll the die for the current player's turn
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated match and board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Match is not active or the die was already rolled
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/move:
    post:
      operationId: moveToken
      tags: [games]
      summary: Move a Ludo token using the current die roll
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "200":
          description: Updated match and board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Illegal token move
        "401":
          description: Not signed in
        "404":
          description: Match not found
  /rooms/{roomId}/cancel:
    post:
      operationId: cancelRoom
      tags: [games]
      summary: Cancel a waiting room and return the reserved sandbox stake
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled waiting room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Only the owner of a waiting room can cancel it
        "401":
          description: Not signed in
        "404":
          description: Match not found
components:
  schemas:
    FootballJoinRequest:
      type: object
      required: [stakeNaira]
      properties:
        stakeNaira: { type: integer, enum: [500, 1000, 2000] }
        roomId: { type: string, format: uuid }
    FootballPlayer:
      type: object
      required: [id, team, number, role, x, y]
      properties:
        id: { type: string }
        team: { type: string, enum: [home, away] }
        number: { type: integer }
        role: { type: string, enum: [GK, DEF, MID, FWD] }
        x: { type: number }
        y: { type: number }
    FootballBall:
      type: object
      required: [x, y, vx, vy, ownerId]
      properties:
        x: { type: number }
        y: { type: number }
        vx: { type: number }
        vy: { type: number }
        ownerId: { type: string, nullable: true }
    FootballState:
      type: object
      required: [players, ball, scoreHome, scoreAway, controlledHome, controlledAway, phase, homeDirection, startedAt, serverTimeAt, elapsedMs, remainingMs, lastTickAt, pauseUntil, ballFreeAt, lastTouchId, lastActionHomeAt, lastActionAwayAt, lastEvent, sequence, winnerTeam]
      properties:
        players:
          type: array
          items: { $ref: '#/components/schemas/FootballPlayer' }
        ball: { $ref: '#/components/schemas/FootballBall' }
        scoreHome: { type: integer }
        scoreAway: { type: integer }
        controlledHome: { type: string }
        controlledAway: { type: string }
        phase: { type: string, enum: [waiting, first_half, second_half, overtime, finished] }
        homeDirection: { type: number, enum: [-1, 1] }
        startedAt: { type: string, format: date-time, nullable: true }
        serverTimeAt: { type: string, format: date-time }
        elapsedMs: { type: integer }
        remainingMs: { type: integer }
        lastTickAt: { type: integer }
        pauseUntil: { type: integer }
        ballFreeAt: { type: integer }
        lastTouchId: { type: string, nullable: true }
        lastActionHomeAt: { type: integer }
        lastActionAwayAt: { type: integer }
        lastEvent: { type: string }
        sequence: { type: integer }
        winnerTeam: { type: string, enum: [home, away], nullable: true }
    FootballRoom:
      type: object
      required: [id, status, stakeNaira, potNaira, prizeNaira, commissionNaira, hostUserId, opponentUserId, winnerUserId, hostUsername, opponentUsername, viewerTeam, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [waiting, active, completed, cancelled] }
        stakeNaira: { type: integer }
        potNaira: { type: integer }
        prizeNaira: { type: integer }
        commissionNaira: { type: integer }
        hostUserId: { type: string, format: uuid }
        opponentUserId: { type: string, format: uuid, nullable: true }
        winnerUserId: { type: string, format: uuid, nullable: true }
        hostUsername: { type: string }
        opponentUsername: { type: string, nullable: true }
        viewerTeam: { type: string, enum: [home, away], nullable: true }
        createdAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/FootballState' }
    FootballLobby:
      type: object
      required: [rooms, myRoom]
      properties:
        rooms:
          type: array
          items: { $ref: '#/components/schemas/FootballRoom' }
        myRoom:
          allOf:
            - $ref: '#/components/schemas/FootballRoom'
          nullable: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      required: [id, username, email, balanceNaira]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        balanceNaira:
          type: integer
          minimum: 0
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    WalletTransaction:
      type: object
      required: [id, type, amountNaira, description, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [deposit, stake_lock, stake_release, prize, withdrawal_lock, withdrawal_release]
        amountNaira:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    WalletResponse:
      type: object
      required: [balanceNaira, totalBalanceNaira, escrowedNaira, withdrawalHeldNaira, transactions, withdrawals]
      properties:
        balanceNaira:
          type: integer
        totalBalanceNaira:
          type: integer
        escrowedNaira:
          type: integer
        withdrawalHeldNaira:
          type: integer
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
    DepositInput:
      type: object
      required: [amountNaira]
      properties:
        amountNaira:
          type: integer
          minimum: 500
          maximum: 500000
    DepositInitialization:
      type: object
      required: [authorizationUrl, reference, amountNaira]
      properties:
        authorizationUrl:
          type: string
          format: uri
        reference:
          type: string
        amountNaira:
          type: integer
    DepositVerificationInput:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          minLength: 8
          maxLength: 120
    DepositVerification:
      type: object
      required: [status, amountNaira, balanceNaira]
      properties:
        status:
          type: string
          enum: [success, pending, failed]
        amountNaira:
          type: integer
        balanceNaira:
          type: integer
    WithdrawalInput:
      type: object
      required: [amountNaira, requestId, recipientName, accountNumber, bankCode]
      properties:
        amountNaira:
          type: integer
          minimum: 500
          maximum: 500000
        requestId:
          type: string
          format: uuid
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        accountNumber:
          type: string
          pattern: "^[0-9]{10}$"
        bankCode:
          type: string
          pattern: "^[0-9]{3,6}$"
    Withdrawal:
      type: object
      required: [id, reference, amountNaira, status, createdAt]
      properties:
        id:
          type: string
        reference:
          type: string
        amountNaira:
          type: integer
        status:
          type: string
          enum: [pending, success, failed]
        createdAt:
          type: string
          format: date-time
    LobbyRoom:
      type: object
      required: [id, stakeNaira, hostUsername, createdAt]
      properties:
        id:
          type: string
        stakeNaira:
          type: integer
          enum: [500, 1000, 2000]
        hostUsername:
          type: string
        createdAt:
          type: string
          format: date-time
    StakeCount:
      type: object
      required: [stakeNaira, waitingPlayers]
      properties:
        stakeNaira:
          type: integer
          enum: [500, 1000, 2000]
        waitingPlayers:
          type: integer
    LobbyResponse:
      type: object
      required: [rooms, stakeCounts, myRoomId]
      properties:
        myRoomId:
          type: ["string", "null"]
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/LobbyRoom"
        stakeCounts:
          type: array
          items:
            $ref: "#/components/schemas/StakeCount"
    JoinRoomInput:
      type: object
      required: [stakeNaira]
      properties:
        roomId:
          type: string
          format: uuid
        stakeNaira:
          type: integer
          enum: [500, 1000, 2000]
    BoardState:
      type: object
      required: [turnUserId, dice, remainingDice, consecutiveDoubles, turnMessage, hasRolled, redTokens, greenTokens, winnerUserId, turnDeadlineAt, matchDeadlineAt, isOvertime, endReason]
      properties:
        matchDeadlineAt:
          type: ["string", "null"]
          format: date-time
        isOvertime:
          type: boolean
        endReason:
          type: ["string", "null"]
          enum: [all_home, timeout, overtime, null]
        turnUserId:
          type: string
        turnDeadlineAt:
          type: ["string", "null"]
          format: date-time
        dice:
          type: ["array", "null"]
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 6
        remainingDice:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            enum: [0, 1]
        consecutiveDoubles:
          type: integer
          minimum: 0
          maximum: 2
        turnMessage:
          type: ["string", "null"]
          enum: [third_double, double_bonus, no_moves, timeout, null]
        hasRolled:
          type: boolean
        redTokens:
          type: array
          items:
            type: integer
        greenTokens:
          type: array
          items:
            type: integer
        winnerUserId:
          type: ["string", "null"]
    PlayerRank:
      type: object
      required: [tokensHome, totalProgress]
      properties:
        tokensHome:
          type: integer
          minimum: 0
          maximum: 4
        totalProgress:
          type: integer
          minimum: 0
          maximum: 232
    Room:
      type: object
      required:
        [id, stakeNaira, potNaira, prizeNaira, commissionNaira, status, hostUserId, hostUsername, opponentUserId, opponentUsername, myColor, board, createdAt, serverTimeAt, scores]
      properties:
        serverTimeAt:
          type: string
          format: date-time
        scores:
          type: object
          required: [red, green]
          properties:
            red:
              $ref: "#/components/schemas/PlayerRank"
            green:
              $ref: "#/components/schemas/PlayerRank"
        id:
          type: string
        stakeNaira:
          type: integer
          enum: [500, 1000, 2000]
        potNaira:
          type: integer
        prizeNaira:
          type: integer
        commissionNaira:
          type: integer
        status:
          type: string
          enum: [waiting, active, completed, cancelled]
        hostUserId:
          type: string
        hostUsername:
          type: string
        opponentUserId:
          type: ["string", "null"]
        opponentUsername:
          type: ["string", "null"]
        myColor:
          type: string
          enum: [red, green]
        board:
          $ref: "#/components/schemas/BoardState"
        createdAt:
          type: string
          format: date-time
    MoveInput:
      type: object
      required: [tokenIndex, diceIndices]
      properties:
        tokenIndex:
          type: integer
          minimum: 0
          maximum: 3
        diceIndices:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            enum: [0, 1]

