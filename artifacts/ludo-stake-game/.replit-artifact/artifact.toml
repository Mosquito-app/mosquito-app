kind = "web"
previewPath = "/"
title = "Mosquito App"
description = "Mosquito App: Ludo Duel and mobile-first 11v11 Football Duel, server-authoritative real-time matches, and test-only Mosquito Wallet wagering."
version = "1.0.0"
id = "artifacts/ludo-stake-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23275

[services.development]
run = "pnpm --filter @workspace/ludo-stake-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ludo-stake-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/ludo-stake-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23275"
BASE_PATH = "/"
