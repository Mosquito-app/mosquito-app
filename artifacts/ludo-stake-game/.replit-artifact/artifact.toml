kind = "web"
previewPath = "/"
title = "Mosquito App"
description = "Mosquito App: two-player Ludo Duel with a classic wooden board, two dice, a 14-minute timer, sudden-death overtime, and Mosquito Wallet for sandbox Paystack deposits and withdrawals."
version = "1.0.0"
id = "artifacts/ludo-stake-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23275

[services.development]
run = "pnpm --filter @workspace/ludo-stake-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ludo-stake-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/ludo-stake-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23275"
BASE_PATH = "/"
